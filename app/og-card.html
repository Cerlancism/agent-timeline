<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e8e8e8; position: relative; }
  .card { position: absolute; inset: 0; display: flex; align-items: center; gap: 64px; padding: 0 96px; box-sizing: border-box; }
  .icon { flex: 0 0 auto; width: 260px; height: 260px; }
  .text { flex: 1 1 auto; min-width: 0; }
  .eyebrow { font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a; margin: 0 0 14px; }
  h1 { font-size: 96px; font-weight: 600; margin: 0 0 22px; line-height: 1; letter-spacing: -0.02em; color: #fff; }
  p { font-size: 34px; line-height: 1.3; margin: 0; color: #b8b8b8; }
  .url { position: absolute; left: 96px; bottom: 48px; font-size: 24px; color: #3fa0ff; }
  .chips { position: absolute; right: 96px; bottom: 48px; display: flex; gap: 12px; }
  .chip { font-size: 22px; padding: 6px 16px; border: 1px solid #383838; border-radius: 999px; color: #8a8a8a; }
</style>
</head>
<body>
<div class="card">
  <svg class="icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="#000" stroke="#383838"/>
    <path d="M10 10C16 10 12 22 20 22H26" fill="none" stroke="#34d17a" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 10H26" fill="none" stroke="#3fa0ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="6" cy="10" r="3" fill="#3fa0ff"/>
    <circle cx="26" cy="10" r="3" fill="#e8e8e8"/>
    <circle cx="26" cy="22" r="3" fill="#34d17a"/>
  </svg>
  <div class="text">
    <div class="eyebrow">Local session explorer</div>
    <h1>Agent Timeline</h1>
    <p>See what your coding agents actually do: every subagent, prompt, tool call and message, mapped and replayed from the transcripts they already write.</p>
  </div>
</div>
<div class="url">cerlancism.github.io/agent-timeline</div>
<div class="chips"><span class="chip">Claude Code</span><span class="chip">Codex</span><span class="chip">Local-first</span></div>
</body>
</html>
